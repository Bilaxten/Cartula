<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StilizedMaps</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header id="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>StilizedMaps</h1>
        <p class="tag">procedural stylized world generator</p>
      </div>
    </header>

    <div class="seg" role="tablist">
      <button id="viewTop" type="button" class="active" role="tab">Top-down</button>
      <button id="viewIso" type="button" role="tab">Isometric</button>
    </div>

    <div class="scroll">
      <details class="group" open>
        <summary>World</summary>
        <div class="body">
          <label for="worldType">World type</label>
          <select id="worldType" title="Sets every generation slider at once. Moving a slider switches this to Custom.">
            <option value="continents">Continents (default)</option>
            <option value="island">Single island</option>
            <option value="frozen">Frozen</option>
            <option value="arid">Arid</option>
            <option value="tropical">Tropical</option>
            <option value="custom" disabled>Custom</option>
          </select>

          <label for="seed">Seed</label>
          <input type="number" id="seed" value="1337">

          <label for="size">Map size <span id="sizeVal">192²</span></label>
          <input type="range" id="size" min="128" max="448" step="32" value="192">
        </div>
      </details>

      <details class="group" open>
        <summary>Elevation</summary>
        <div class="body">
          <label for="sea" title="How much of the world is sea. The value shows the land share of the generated map.">Sea level <span id="seaVal">—</span></label>
          <input type="range" id="sea" min="0.15" max="0.70" step="0.01" value="0.38">

          <label for="rugged" title="Blend of sharp ridged mountains into the rolling base terrain.">Ruggedness <span id="ruggedVal">0.35</span></label>
          <input type="range" id="rugged" min="0" max="1" step="0.05" value="0.35">

          <label for="warp" title="Domain warp: bends coastlines and ranges into organic shapes.">Coast warp <span id="warpVal">0.18</span></label>
          <input type="range" id="warp" min="0" max="0.5" step="0.02" value="0.18">

          <label for="escale" title="Noise frequency. Lower = fewer, larger landmasses; higher = many small features.">Feature scale <span id="escaleVal">2.5</span></label>
          <input type="range" id="escale" min="1" max="6" step="0.1" value="2.5">

          <label for="octaves" title="Noise octaves: fine surface detail on top of the large shapes.">Detail <span id="octavesVal">5</span></label>
          <input type="range" id="octaves" min="2" max="7" step="1" value="5">

          <label for="island" title="Gathers the land into one central mass with open sea around it. Sea level still sets how much land there is.">Island <span id="islandVal">off</span></label>
          <input type="range" id="island" min="0" max="1" step="0.05" value="0">
        </div>
      </details>

      <details class="group" open>
        <summary>Climate</summary>
        <div class="body">
          <label for="tbias" title="Shifts the whole climate colder (tundra, taiga, snow) or hotter (savanna, desert, jungle).">Temperature <span id="tbiasVal">Temperate</span></label>
          <input type="range" id="tbias" min="-0.3" max="0.3" step="0.02" value="0">

          <label for="mbias" title="Shifts rainfall: drier (shrubland, desert) or wetter (forest, marsh, jungle).">Rainfall <span id="mbiasVal">Normal</span></label>
          <input type="range" id="mbias" min="-0.3" max="0.3" step="0.02" value="0">

          <label for="rivers" title="How many river sources are traced from the summits.">Rivers <span id="riversVal">Normal</span></label>
          <input type="range" id="rivers" min="0" max="2" step="0.25" value="1">
        </div>
      </details>

      <details class="group" open>
        <summary>View</summary>
        <div class="body">
          <label for="isoexag">Height exaggeration (iso) <span id="isoexagVal">1.6</span></label>
          <input type="range" id="isoexag" min="0.6" max="3" step="0.1" value="1.6">

          <label for="sun">Time of day <span id="sunVal">14:00</span></label>
          <input type="range" id="sun" min="6" max="29.5" step="0.5" value="14">

          <label for="debugView" id="debugViewLabel">Render debug view</label>
          <select id="debugView">
            <option value="0">Lit (normal)</option>
            <option value="1">Ambient occlusion</option>
            <option value="2">Normals</option>
            <option value="3">Height (voxel level)</option>
            <option value="4">Albedo (unlit)</option>
            <option value="5">Sun shadow</option>
            <option value="6">Waterfall faces</option>
          </select>

          <label class="check" id="cloudControl">
            <input type="checkbox" id="showClouds" checked> Clouds &amp; birds
          </label>
          <label class="check">
            <input type="checkbox" id="showAnim" checked> Terrain animation
          </label>
          <label class="check"><input type="checkbox" id="showGrid"> Grid lines</label>
          <label class="check"><input type="checkbox" id="showShade" checked> Hillshade</label>
        </div>
      </details>

      <details class="group" id="pipelineGroup" open>
        <summary>Pipeline</summary>
        <div class="body">
          <button id="pipelineToggle" type="button" aria-pressed="false">Step through generation</button>
          <div id="stageControls" hidden>
            <p id="stageLabel" class="stage-label"></p>
            <input type="range" id="stageSlider" min="0" max="9" step="1" value="9" aria-label="Generation stage">
            <div class="edit-actions">
              <button id="stagePrev" type="button">&#9664; Prev</button>
              <button id="stageNext" type="button">Next &#9654;</button>
            </div>
            <p id="stageDesc" class="edit-note"></p>
          </div>
        </div>
      </details>

      <details class="group" id="editGroup" open>
        <summary>Edit</summary>
        <div class="body">
          <label for="editTool">Tool</label>
          <select id="editTool">
            <option value="pan">Pan</option>
            <option value="raise">Raise</option>
            <option value="lower">Lower</option>
            <option value="smooth">Smooth</option>
            <option value="water">Water</option>
            <option value="land">Land</option>
            <option value="river">Draw river</option>
            <option value="biome">Paint biome</option>
          </select>

          <label for="brushSize">Brush size <span id="brushSizeVal">4</span></label>
          <input type="range" id="brushSize" min="1" max="12" step="1" value="4">

          <label for="brushStrength">Strength <span id="brushStrengthVal">0.5</span></label>
          <input type="range" id="brushStrength" min="0.1" max="1" step="0.1" value="0.5">

          <label for="editBiome">Biome</label>
          <select id="editBiome"></select>

          <div class="edit-actions">
            <button id="editUndo" type="button" disabled>Undo</button>
            <button id="editRedo" type="button" disabled>Redo</button>
            <button id="editReset" type="button">Reset to generated</button>
          </div>
          <p class="edit-note">Brushes work in top-down view.</p>
        </div>
      </details>

      <details class="group" id="legendGroup" open>
        <summary>Biomes</summary>
        <div class="body" id="legend"></div>
      </details>
    </div>

    <button id="randomMap" type="button" class="primary" title="New random seed, same settings (R)">
      <svg class="dice" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="8" cy="8" r="1.6" fill="currentColor"/>
        <circle cx="16" cy="8" r="1.6" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
        <circle cx="8" cy="16" r="1.6" fill="currentColor"/>
        <circle cx="16" cy="16" r="1.6" fill="currentColor"/>
      </svg>
      <span>Random</span>
    </button>

    <footer id="tools">
      <span id="stats"></span>
      <div class="toolrow">
        <button id="exportPng" type="button" title="Download the current view as a PNG">Export PNG</button>
        <button id="shareLink" type="button" title="Copy a link that reproduces this map">Copy link</button>
      </div>
      <div class="toolrow">
        <button id="exportUnity" type="button" title="Heightmap (16-bit RAW), albedo, biome mask and map.json as one .zip — Unity Terrain ready">Export for Unity (.zip)</button>
      </div>
    </footer>
  </aside>

  <main id="stage">
    <div id="hover"></div>
    <div id="brushCursor" hidden></div>
    <div id="isohint">drag to pan &middot; scroll to zoom</div>
    <div id="yawControl" hidden>
      <input type="range" id="rotSlider" min="0" max="360" step="1" value="45"
        aria-label="Camera yaw">
      <span id="rotVal">045°</span>
      <button id="autoRotateBtn" type="button" aria-pressed="false" title="Auto-rotate">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.2 8A5.2 5.2 0 1 1 10.6 3.4" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round"/>
          <path d="M10.2 1.6l0.9 2.6-2.7 0.5" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <canvas id="map"></canvas>
    <canvas id="gl" hidden></canvas>
    <canvas id="riverfx"></canvas>
    <div id="daynight"></div>
  </main>
</div>

<script src="src/noise.js"></script>
<script src="src/biome.js"></script>
<script src="src/grid.js"></script>
<script src="src/generate.js"></script>
<script src="src/export.js"></script>
<script src="src/render/topdown.js"></script>
<script src="src/render/sky.js"></script>
<script src="src/render/voxel3d.js"></script>
<script src="src/time.js"></script>
<script src="src/main.js"></script>
</body>
</html>
