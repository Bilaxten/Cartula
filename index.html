<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StilizedMaps</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <header id="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>StilizedMaps</h1>
        <p class="tag">procedural stylized world generator</p>
      </div>
    </header>

    <div class="seg" role="tablist">
      <button id="viewTop" type="button" class="active" role="tab">Top-down</button>
      <button id="viewIso" type="button" role="tab">Isometric</button>
    </div>

    <div class="scroll">
      <details class="group" open>
        <summary>World</summary>
        <div class="body">
          <label for="seed">Seed</label>
          <div class="row">
            <input type="number" id="seed" value="1337">
            <button id="randomSeed" type="button" title="Random seed">shuffle</button>
          </div>

          <label for="size">Map size <span id="sizeVal">192²</span></label>
          <input type="range" id="size" min="128" max="448" step="32" value="192">
        </div>
      </details>

      <details class="group" open>
        <summary>Elevation</summary>
        <div class="body">
          <label for="sea">Sea &harr; land <span id="seaVal">62% land</span></label>
          <input type="range" id="sea" min="0.15" max="0.70" step="0.01" value="0.38">

          <label for="rugged">Ruggedness <span id="ruggedVal">0.35</span></label>
          <input type="range" id="rugged" min="0" max="1" step="0.05" value="0.35">

          <label for="warp">Distortion <span id="warpVal">0.18</span></label>
          <input type="range" id="warp" min="0" max="0.5" step="0.02" value="0.18">

          <label for="escale">Terrain scale <span id="escaleVal">2.5</span></label>
          <input type="range" id="escale" min="1" max="6" step="0.1" value="2.5">

          <label for="octaves">Detail <span id="octavesVal">5</span></label>
          <input type="range" id="octaves" min="2" max="7" step="1" value="5">

          <label for="island">Island falloff <span id="islandVal">0.00</span></label>
          <input type="range" id="island" min="0" max="1" step="0.05" value="0">
        </div>
      </details>

      <details class="group" open>
        <summary>Climate</summary>
        <div class="body">
          <label for="mscale">Moisture scale <span id="mscaleVal">3.0</span></label>
          <input type="range" id="mscale" min="1" max="6" step="0.1" value="3.0">

          <label for="tbias">Temperature bias <span id="tbiasVal">+0.00</span></label>
          <input type="range" id="tbias" min="-0.3" max="0.3" step="0.02" value="0">

          <label for="mbias">Moisture bias <span id="mbiasVal">+0.00</span></label>
          <input type="range" id="mbias" min="-0.3" max="0.3" step="0.02" value="0">

          <label for="rivers">Rivers <span id="riversVal">1.0</span></label>
          <input type="range" id="rivers" min="0" max="2" step="0.25" value="1">
        </div>
      </details>

      <details class="group" open>
        <summary>View</summary>
        <div class="body">
          <label for="isoexag">Height exaggeration (iso) <span id="isoexagVal">1.6</span></label>
          <input type="range" id="isoexag" min="0.6" max="3" step="0.1" value="1.6">

          <label for="sun">Time of day <span id="sunVal">14:00</span></label>
          <input type="range" id="sun" min="6" max="29.5" step="0.5" value="14">

          <label class="check" id="cloudControl">
            <input type="checkbox" id="showClouds" checked> Clouds
          </label>
          <label class="check">
            <input type="checkbox" id="showAnim" checked> Terrain animation
          </label>
          <label class="check" id="autoRotateControl">
            <input type="checkbox" id="autoRotate"> Auto-rotate (iso 3D)
          </label>
          <label class="check"><input type="checkbox" id="showGrid"> Grid lines</label>
          <label class="check"><input type="checkbox" id="showShade" checked> Hillshade</label>
        </div>
      </details>

      <details class="group" id="editGroup" open>
        <summary>Edit</summary>
        <div class="body">
          <label for="editTool">Tool</label>
          <select id="editTool">
            <option value="pan">Pan</option>
            <option value="raise">Raise</option>
            <option value="lower">Lower</option>
            <option value="smooth">Smooth</option>
            <option value="water">Water</option>
            <option value="land">Land</option>
            <option value="biome">Paint biome</option>
          </select>

          <label for="brushSize">Brush size <span id="brushSizeVal">4</span></label>
          <input type="range" id="brushSize" min="1" max="12" step="1" value="4">

          <label for="brushStrength">Strength <span id="brushStrengthVal">0.5</span></label>
          <input type="range" id="brushStrength" min="0.1" max="1" step="0.1" value="0.5">

          <label for="editBiome">Biome</label>
          <select id="editBiome"></select>

          <div class="edit-actions">
            <button id="editUndo" type="button" disabled>Undo</button>
            <button id="editRedo" type="button" disabled>Redo</button>
            <button id="editReset" type="button">Reset to generated</button>
          </div>
          <p class="edit-note">Brushes work in top-down view.</p>
        </div>
      </details>

      <details class="group" id="legendGroup" open>
        <summary>Biomes</summary>
        <div class="body" id="legend"></div>
      </details>
    </div>

    <button id="regen" type="button" class="primary">Regenerate</button>

    <footer id="tools">
      <span id="stats"></span>
      <div class="toolrow">
        <button id="exportPng" type="button" title="Download the current view as a PNG">Export PNG</button>
        <button id="shareLink" type="button" title="Copy a link that reproduces this map">Copy link</button>
      </div>
    </footer>
  </aside>

  <main id="stage">
    <div id="hover"></div>
    <div id="brushCursor" hidden></div>
    <div id="isohint">drag to pan &middot; scroll to zoom</div>
    <div id="yawControl" hidden>
      <input type="range" id="rotSlider" min="0" max="360" step="1" value="45"
        aria-label="Camera yaw">
      <span id="rotVal">045°</span>
    </div>
    <canvas id="map"></canvas>
    <canvas id="gl" hidden></canvas>
    <canvas id="riverfx"></canvas>
    <div id="daynight"></div>
  </main>
</div>

<script src="src/noise.js"></script>
<script src="src/biome.js"></script>
<script src="src/grid.js"></script>
<script src="src/generate.js"></script>
<script src="src/render/topdown.js"></script>
<script src="src/render/iso.js"></script>
<script src="src/render/voxel3d.js"></script>
<script src="src/time.js"></script>
<script src="src/main.js"></script>
</body>
</html>
