<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StilizedMaps</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>StilizedMaps</h1>
    <p class="muted">M1 — üretim + üstten görünüm</p>

    <label for="seed">Seed</label>
    <div class="row">
      <input type="number" id="seed" value="1337">
      <button id="randomSeed" type="button" title="Rastgele seed">🎲</button>
    </div>

    <label for="size">Boyut — <span id="sizeVal">96</span>²</label>
    <input type="range" id="size" min="32" max="192" step="16" value="96">

    <label for="sea">Deniz seviyesi — <span id="seaVal">0.40</span></label>
    <input type="range" id="sea" min="0.15" max="0.70" step="0.01" value="0.40">

    <label for="escale">Arazi ölçeği — <span id="escaleVal">2.5</span></label>
    <input type="range" id="escale" min="1" max="6" step="0.1" value="2.5">

    <label for="mtn">Dağlılık — <span id="mtnVal">1.0</span></label>
    <input type="range" id="mtn" min="0.5" max="3" step="0.1" value="1.0">

    <label for="mscale">Nem ölçeği — <span id="mscaleVal">3.0</span></label>
    <input type="range" id="mscale" min="1" max="6" step="0.1" value="3.0">

    <label for="island">Ada falloff — <span id="islandVal">0.00</span></label>
    <input type="range" id="island" min="0" max="1" step="0.05" value="0">

    <label class="check"><input type="checkbox" id="showGrid"> Izgara çizgileri</label>
    <label class="check"><input type="checkbox" id="showShade" checked> Tepe gölgesi</label>

    <button id="regen" type="button" class="primary">↻ Yeniden üret</button>

    <div id="stats" class="muted"></div>
    <div id="legend"></div>
  </aside>

  <main id="stage">
    <canvas id="map"></canvas>
  </main>
</div>

<script src="src/noise.js"></script>
<script src="src/biome.js"></script>
<script src="src/grid.js"></script>
<script src="src/generate.js"></script>
<script src="src/render/topdown.js"></script>
<script src="src/main.js"></script>
</body>
</html>
